<!DOCTYPE html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%" class="h-full" data-accent="bleu">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)" />
        <meta name="text-scale" content="scale" />
        <meta name="keywords" content="npm,encyclopedia,wiki,timeline,typescript,eslint,a11y,prettier,svelte,husky,tailwindcss,vite,sveltekit,inlang" />

        <link rel="author" href="https://github.com/FlorianLeChat" />
        <meta name="author" content="Florian Trayon" />

        <meta property="og:url" content="https://github.com/FlorianLeChat/Pericles-Initiative" />
        <meta property="og:image" content="https://opengraph.githubassets.com/e2e560fe232b491a74dee246db664d8fe51da79d/FlorianLeChat/Pericles-Initiative" />
        <meta property="og:type" content="website" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:creator" content="@FlorianTrayon" />
        <meta name="twitter:image" content="https://opengraph.githubassets.com/e2e560fe232b491a74dee246db664d8fe51da79d/FlorianLeChat/Pericles-Initiative" />

        <script>
            const key = "pericles:theme";
            const element = document.documentElement;

            let stored = null;

            try {
                stored = localStorage.getItem(key);
            } catch {
                /* storage unavailable, the system preference decides on every visit */
            }

            element.classList.remove("light", "dark");

            const chosen = stored === "light" || stored === "dark";
            const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

            element.classList.add(chosen ? stored : system);

            /*
             * The accent chosen in the settings, read before the first paint like the
             * theme, so a reload no longer flashes the default blue and animates to the
             * real colour once the layout has hydrated. Only a key the stylesheet knows
             * is written, so a damaged overlay leaves the default in place. The list is
             * kept in step with `ACCENTS` in `src/lib/config/accents.ts`: this script
             * runs before any module can be imported.
             */
            try {
                const accent = JSON.parse(localStorage.getItem("pericles:overlay") ?? "null")?.meta?.accent;
                const known = ["bleu", "vert", "ambre", "violet", "rose", "cyan"];

                if (known.includes(accent)) {
                    element.dataset.accent = accent;
                }
            } catch {
                /* unreadable overlay, the default accent stays until the layout reads it */
            }
        </script>

        %sveltekit.head%
    </head>

    <body class="h-full" data-sveltekit-preload-data="hover">
        <div class="flex min-h-full flex-col">
            %sveltekit.body%
        </div>
    </body>
</html>
