<!doctype html>
<html lang="fr" class="h-full">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/media/icon-192.png" />
        <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#121218" media="(prefers-color-scheme: dark)" />
        <script>
            // Applied before first paint so the stored theme never flashes.
            try {
                const stored = localStorage.getItem('pericles:theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (stored === 'dark' || (!stored && prefersDark)) {
                    document.documentElement.classList.add('dark');
                }
            } catch {
                /* storage unavailable, keep the light theme */
            }
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover" class="h-full">
        <div class="flex min-h-full flex-col">%sveltekit.body%</div>
    </body>
</html>
